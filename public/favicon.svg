<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1F44"/>
      <stop offset="100%" stop-color="#05122B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C775"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#9A7727"/>
    </linearGradient>
  </defs>
  <!-- Background Shield/Rounded -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Gold Outer Border -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#gold)" stroke-width="12"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#C9A84C" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  
  <!-- Text PSA -->
  <text x="256" y="270" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="160" text-anchor="middle" fill="url(#gold)" letter-spacing="4">PSA</text>
  
  <!-- Subtitle -->
  <text x="256" y="325" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="34" text-anchor="middle" fill="#FFFFFF" letter-spacing="10">INVESTMENT</text>
  
  <!-- Candlestick / Institutional Trend Chevron -->
  <g transform="translate(186, 360)">
    <rect x="0" y="20" width="16" height="40" rx="4" fill="#10B981"/>
    <line x1="8" y1="10" x2="8" y2="70" stroke="#10B981" stroke-width="4"/>
    
    <rect x="58" y="10" width="16" height="50" rx="4" fill="#C9A84C"/>
    <line x1="66" y1="0" x2="66" y2="70" stroke="#C9A84C" stroke-width="4"/>
    
    <rect x="116" y="0" width="16" height="60" rx="4" fill="#10B981"/>
    <line x1="124" y1="-10" x2="124" y2="70" stroke="#10B981" stroke-width="4"/>
  </g>
</svg>
